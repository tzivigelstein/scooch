name: Bug report
description: Something doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Issues are public. Don't attach private documents or photos** (IDs, passports, personal pictures, anything with personal data). If the bug needs a file, reproduce it with one you made up for the purpose and attach that one.

        For security problems, don't open an issue: follow the [security policy](https://github.com/tzivigelstein/scooch/security/policy).
  - type: textarea
    id: summary
    attributes:
      label: What's wrong
      description: A short description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a PDF with 3 pages
        2. Select the second piece
        3. Download the PDF
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Screenshots help, as long as they show nothing private.
    validations:
      required: true
  - type: dropdown
    id: files
    attributes:
      label: Files involved
      options:
        - Images
        - PDFs
        - Both images and PDFs
        - None, it's not about the files
    validations:
      required: true
  - type: input
    id: formats
    attributes:
      label: File formats and sizes
      description: Optional. For example "HEIC photos from a phone" or "a 40-page PDF, 12 MB".
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 131, Safari 18.2, Firefox 133…
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and device
      placeholder: Windows 11 laptop, iPhone with iOS 18, Android tablet…
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Optional. Errors in the browser console, or, if the printed size is wrong, the printer model and the scale chosen in the print dialog.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I didn't attach private documents, photos or personal data.
          required: true
