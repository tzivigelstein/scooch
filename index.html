<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <!-- Texts in double braces come from src/copy (see fillStaticCopy in src/copy/static.ts). -->
    <title>{{app.title}}</title>
    <meta name="description" content="{{app.description}}" />
    <meta name="color-scheme" content="light dark" />
    <meta id="theme-color-light" name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta id="theme-color-dark" name="theme-color" content="#15171c" media="(prefers-color-scheme: dark)" />
    <script type="application/json" id="boot-copy">{{bootCopy}}</script>
    <script>
      // The theme before the first paint: the one chosen in «Preferencias»
      // (read like parseThemePref in src/core/storedprefs.js) or the system's.
      // Afterwards src/services/theme.ts applies it the same way (applyTheme).
      (() => {
        let theme;
        try {
          theme = JSON.parse(localStorage.getItem("scooch:theme-preference")).theme;
        } catch {}
        if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="color-scheme"]').setAttribute("content", theme);
        for (const option of ["light", "dark"]) document.getElementById("theme-color-" + option).setAttribute("media", option === theme ? "all" : "not all");
      })();
      // The language before the first paint: the one chosen in «Preferencias»
      // (read like parseLanguagePref in src/core/storedprefs.js) or the
      // browser's best match (matchLanguage, inlined from src/core/language.js).
      // It says the page's language, title and description in it, and starts
      // downloading its texts (and Hindi's font, declared at once so the
      // loading screen can use it). Afterwards src/services/language.ts
      // applies it the same way (applyTexts).
      (() => {
        const boot = JSON.parse(document.getElementById("boot-copy").textContent);
        let language;
        try {
          language = JSON.parse(localStorage.getItem("scooch:language-preference")).language;
        } catch {}
        if (!boot.languages.includes(language)) language = ({{matchLanguage}})(navigator.languages || [navigator.language], boot.languages);
        const texts = boot.texts[language];
        document.documentElement.lang = language;
        document.title = texts.title;
        document.querySelector('meta[name="description"]').setAttribute("content", texts.description);
        const preload = (href, font) => {
          const link = document.createElement("link");
          link.rel = font ? "preload" : "modulepreload";
          link.href = href;
          if (font) for (const [name, value] of [["as", "font"], ["type", "font/woff2"], ["crossorigin", ""]]) link.setAttribute(name, value);
          document.head.append(link);
        };
        if (boot.chunks[language]) preload(boot.chunks[language], false);
        for (const font of boot.fonts[language] || []) preload(font, true);
        if (boot.styles[language]) document.head.append(Object.assign(document.createElement("style"), { textContent: boot.styles[language] }));
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='7' y='2.5' width='14' height='17' rx='2.5' fill='%230066ff' opacity='.3'/><rect x='3' y='5' width='14' height='17' rx='2.5' fill='%230066ff'/><rect x='6' y='8.5' width='4' height='5' rx='1' fill='white'/><rect x='11' y='8.5' width='3' height='3' rx='.8' fill='white'/><rect x='11' y='12.5' width='3' height='6' rx='.8' fill='white'/><rect x='6' y='14.5' width='4' height='4' rx='1' fill='white'/></svg>" />
    <!-- Inter's Latin subset: the only one the interface needs (the rest load by text). -->
    <link rel="preload" href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Critical styles, inline: nothing shows unstyled before the stylesheet
         arrives (in dev, Vite injects it from JS). Colors match src/styles/tokens.css.
         They are the first cascade layer (src/styles/index.css lists the order),
         so every rule of the stylesheet wins over them once it arrives:
         unlayered, they would beat it whatever its selectors. */
      @layer boot {
        html,
        body {
          height: 100%;
          margin: 0;
        }
        body {
          background: #ffffff;
          color: #0e1014;
          font: 0.875rem/1.45 "Inter Variable", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .sr-only {
          position: absolute !important;
          width: 1px;
          height: 1px;
          padding: 0;
          margin: -1px;
          overflow: hidden;
          clip: rect(0 0 0 0);
          clip-path: inset(50%);
          white-space: nowrap;
          border: 0;
        }
        /* Until the app shows: a skeleton of the editor (top bar, pieces panel,
           canvas with a sheet, properties panel), drawn at once with the
           stylesheet's own metrics so that nothing moves when the app takes its
           place. src/App.tsx removes it once the last project is open.
           tests/site/boot-skeleton.test.ts checks the values copied here. */
        .boot {
          /* From src/styles/tokens.css. */
          --bg: #ffffff;
          --canvas: #eef0f3;
          --surface: #ffffff;
          --text: #0e1014;
          --line: #e1e4e8;
          --line-strong: #858b97;
          --accent: #0066ff;
          --sheet-shadow: 0 1px 0.125rem rgb(16 18 24 / 0.1), 0 0.375rem 1.125rem rgb(16 18 24 / 0.08), 0 1.5rem 3rem rgb(16 18 24 / 0.08);
          --topbar-h: 3.5rem;
          --left-w: clamp(14.25rem, 15vw, 20rem);
          --right-w: clamp(18rem, 19vw, 24rem);
          --rail-w: 3.25rem;
          /* Placeholders: a tint of the text over whatever is below. */
          --ph: rgb(16 18 24 / 0.08);
          position: fixed;
          inset: 0;
          display: grid;
          grid: "bar bar bar" calc(var(--topbar-h) + env(safe-area-inset-top)) "left canvas right" minmax(0, 1fr) / var(--left-w) minmax(0, 1fr) var(--right-w);
          /* The safe areas beside a notch, as .workspace leaves them (the bar spans them). */
          padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
          background: var(--canvas);
          color: var(--accent);
        }
        /* The brand, where .brand puts it. */
        .boot svg,
        .boot-name {
          position: absolute;
          z-index: 1;
          top: calc(0.90625rem + env(safe-area-inset-top));
          left: max(1rem, env(safe-area-inset-left));
        }
        .boot svg {
          width: 1.625rem;
          height: 1.625rem;
        }
        .boot-name {
          top: calc(0.8125rem + env(safe-area-inset-top));
          left: calc(max(1rem, env(safe-area-inset-left)) + 2.125rem);
          margin: 0;
          color: var(--text);
          font-size: 1.25rem;
          font-weight: 800;
          letter-spacing: -0.03em;
        }
        /* The canvas as .stage lays it out (canvas/Stage.css), its padding grown by
           the sheet's title above (.page-head) and «Agregar hoja» below (the
           .sheets gap, the .sheets-foot margin and the .add-sheet height): what
           is left is the room fitZoom (canvas/viewport.ts) fits the sheet in,
           with the sheet in its middle. */
        .boot-stage {
          grid-area: canvas;
          position: relative;
          display: grid;
          place-content: center;
          padding: calc(1.25rem + 2.25rem) 2.25rem calc(4rem + 1.25rem - 0.375rem + 2rem);
          overflow: hidden;
          scrollbar-gutter: stable;
          container-type: size;
        }
        .boot-bar {
          grid-area: bar;
          display: flex;
          align-items: center;
          gap: 1.125rem;
          margin: 0 calc(-1 * env(safe-area-inset-right)) 0 calc(-1 * env(safe-area-inset-left));
          padding: env(safe-area-inset-top) max(0.625rem, env(safe-area-inset-right)) 0 max(1rem, env(safe-area-inset-left));
          border-bottom: 1px solid var(--line);
          background: var(--bg);
        }
        .boot-bar > span {
          display: flex;
          align-items: center;
          gap: 0.25rem;
        }
        /* A placeholder is a button's icon unless it says otherwise. */
        :where(.boot) i {
          display: block;
          flex: none;
          box-sizing: border-box;
          width: 1.25rem;
          height: 1.25rem;
          margin: 0 0.5rem;
          border-radius: 0.375rem;
          background: var(--ph);
        }
        /* Room for the brand drawn above. */
        .boot-brand {
          width: 7rem;
          margin-left: -0.25rem;
          visibility: hidden;
        }
        .boot-txt,
        .boot-btn {
          width: 4rem;
          height: 0.75rem;
        }
        .boot-btn {
          width: 5rem;
          margin: 0 0.875rem;
        }
        .boot-wide {
          width: 6.125rem;
        }
        .boot-end {
          margin-left: auto;
        }
        /* The panels take the free cells beside the canvas. */
        .boot-left,
        .boot-right {
          border: solid var(--line);
          border-width: 0 1px 0 0;
          background: var(--surface);
        }
        .boot-right {
          border-width: 0 0 0 1px;
        }
        .boot-pane {
          display: grid;
        }
        /* A title, in the middle of a 2.75rem head like .panel-head. */
        .boot-pane > .boot-txt {
          width: 2.75rem;
          margin: 1.125rem 1rem 0.875rem;
        }
        .boot-drop,
        .boot-row,
        .boot-field {
          position: relative;
          width: auto;
          background: none;
        }
        .boot-pane > .boot-drop {
          height: 4.5rem;
          margin: 0.125rem 0.75rem 0.625rem;
          border: 1.5px dashed var(--line-strong);
          border-radius: 0.625rem;
        }
        .boot-pane > .boot-row {
          height: 3rem;
          margin: 0 0.5rem;
        }
        .boot-pane > .boot-field {
          height: 2.125rem;
          margin: 1.5rem 1rem 0;
          border: 1px solid var(--line);
          border-radius: 0.5rem;
        }
        .boot-row::before,
        .boot-row::after,
        .boot-field::before,
        .boot-dock::after {
          content: "";
          position: absolute;
          top: 0.375rem;
          left: 0.625rem;
          width: 2.25rem;
          height: 2.25rem;
          border-radius: 0.3125rem;
          background: var(--ph);
        }
        .boot-row::after {
          top: 1.1875rem;
          left: 3.5rem;
          width: 50%;
          height: 0.625rem;
        }
        .boot-field::before {
          top: -1.3125rem;
          left: 0;
          width: 3.5rem;
          height: 0.625rem;
        }
        /* .props-tabs: two tabs of 2.5rem under 0.375rem, over a line. */
        .boot-tabs {
          display: grid;
          grid: 2.5rem / auto-flow 1fr;
          place-items: center;
          padding: 0.375rem 0.75rem 0;
          border-bottom: 1px solid var(--line);
        }
        .boot-tabs i {
          width: 3rem;
          height: 0.625rem;
        }
        /* An A4 sheet (the default paper) at the zoom that fits it. */
        .boot-sheet {
          display: grid;
          place-content: start center;
          grid-template-columns: min(18rem, 100% - 2.5rem);
          width: min(100cqw, 100cqh * 210 / 297);
          height: min(100cqh, 100cqw * 297 / 210);
          overflow: hidden;
          border-radius: 0.125rem;
          background: #fff;
          box-shadow: var(--sheet-shadow);
          container-type: size;
        }
        /* What the tool does, on the sheet (the sheet is white in both themes):
           read at once on slow loads, and by crawlers that don't run
           JavaScript. Smaller on a small sheet, so it never spills off it.
           Anchored at its top and its lines' start: when the fonts arrive and
           it rewraps, it only grows or shrinks downward, so nothing shifts. */
        .boot-about {
          margin: 35cqh 0 0;
          color: #555c69;
          font-size: clamp(0.625rem, 4.5cqw, 0.875rem);
          text-wrap: balance;
        }
        /* The panel buttons of narrow screens, as .dock places them. */
        .boot-dock {
          display: none;
          position: absolute;
          bottom: calc(0.75rem + env(safe-area-inset-bottom));
          left: 0.75rem;
          width: 6.5625rem;
          height: 2.75rem;
          margin: 0;
          border: 1px solid var(--line);
          border-radius: 1.375rem;
          background: var(--surface);
        }
        .boot-dock + .boot-dock {
          left: auto;
          right: 0.75rem;
          width: 9.1875rem;
        }
        .boot-dock::after {
          inset: 1rem;
          width: auto;
          height: auto;
        }
        /* Still loading after a while: the placeholders breathe. */
        .boot-bar > span,
        .boot-pane {
          animation: boot-pulse 0.9s ease-in-out 1s infinite alternate;
        }
        /* The message without JavaScript, and the one when the editor couldn't
           open (src/services/bootFailure.ts), over its reload button. */
        .noscript,
        .boot-failed {
          position: fixed;
          inset: 0;
          display: grid;
          place-content: center;
          justify-items: center;
          gap: 0.5rem;
          padding: 1rem;
          text-align: center;
        }
        .noscript p,
        .boot-failed p {
          max-width: 28rem;
          margin: 0;
        }
        @keyframes boot-pulse {
          to {
            opacity: 0.45;
          }
        }
        /* Medium screens (LEFT_DRAWER_QUERY): a rail for the pieces panel, the brand without its name. */
        @media (max-width: 1099.98px) {
          .boot {
            grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--right-w);
          }
          .boot-stage {
            padding: calc(1.75rem + 2.25rem) 1.75rem calc(4rem + 1.25rem - 0.375rem + 2rem);
          }
          .boot-bar {
            gap: 0.75rem;
          }
          .boot-brand {
            width: 2.125rem;
          }
          .boot-name,
          .boot-left .boot-pane {
            display: none;
          }
          .boot-pal,
          .boot-left::before {
            width: 1.25rem;
            height: 1.25rem;
            margin: 0 0.5rem;
          }
          .boot-left::before {
            content: "";
            display: block;
            margin: 1.25rem auto 0;
            border-radius: 0.375rem;
            background: var(--ph);
          }
        }
        /* Narrow screens (NARROW_QUERY): no panels, the top bar on two rows, the dock. */
        @media (max-width: 799.98px) {
          .boot {
            grid: "bar" auto "canvas" minmax(0, 1fr) / minmax(0, 1fr);
          }
          .boot-stage {
            padding: calc(4.25rem + 2.75rem) 1rem calc(8.25rem + 1.25rem - 0.375rem + 2.5rem);
          }
          .boot svg {
            top: calc(0.625rem + env(safe-area-inset-top));
            left: max(0.75rem, env(safe-area-inset-left));
          }
          .boot-left,
          .boot-right {
            display: none;
          }
          .boot-bar {
            display: grid;
            grid: 2.875rem 3rem / auto minmax(0, 1fr) auto;
            gap: 0.5rem;
            padding: env(safe-area-inset-top) max(0.375rem, env(safe-area-inset-right)) 0 max(0.75rem, env(safe-area-inset-left));
          }
          .boot-brand {
            width: 2.5rem;
          }
          .boot-bar > span {
            gap: 0;
          }
          .boot-bar > span:first-of-type {
            grid-column: 2 / -1;
            justify-content: space-between;
          }
          .boot-bar > span:nth-of-type(2) {
            grid-area: 2 / 1 / 3 / 3;
          }
          .boot-bar span i:not(.boot-txt) {
            width: 1.25rem;
            height: 1.25rem;
            margin: 0 0.625rem;
          }
          .boot-dock {
            display: block;
          }
        }
        /* The dark theme the script above chose. :where() keeps these as weak as
           the rules above, which they follow; the layer keeps them weaker than
           the stylesheet's own rules. */
        :where([data-theme="dark"]) body {
          background: #15171c;
          color: #eef0f3;
        }
        :where([data-theme="dark"]) .boot {
          --bg: #15171c;
          --canvas: #0b0c0f;
          --surface: #17191e;
          --text: #eef0f3;
          --line: #2c3038;
          --line-strong: #737a88;
          --accent: #5c9dff;
          --sheet-shadow: 0 0.125rem 0.25rem rgb(0 0 0 / 0.5), 0 1rem 3rem rgb(0 0 0 / 0.55);
          --ph: rgb(255 255 255 / 0.08);
        }
        /* Hindi's font (declared by the script above) after Inter, as in src/styles/tokens.css. */
        :where(:root:lang(hi)) body {
          font-family: "Inter Variable", "Noto Sans Devanagari Variable", system-ui, sans-serif;
        }
        @media (prefers-reduced-motion: reduce) {
          .boot * {
            animation: none;
          }
        }
      }
    </style>
    <noscript>
      <style>
        .boot {
          display: none;
        }
        /* No script, no data-theme: the system's dark theme over the stylesheet's light one. */
        @media (prefers-color-scheme: dark) {
          html body {
            background: #15171c;
            color: #eef0f3;
          }
        }
      </style>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body class="is-loading">
    <div id="root"></div>
      <div class="boot" role="main" aria-busy="true" aria-label="{{busy.loading}}">
        <h1 class="sr-only">{{app.heading}}</h1>
        <svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true" focusable="false">
          <rect x="7" y="2.5" width="14" height="17" rx="2.5" fill="currentColor" opacity=".28" />
          <rect x="3" y="5" width="14" height="17" rx="2.5" fill="currentColor" />
          <rect x="6" y="8.5" width="4" height="5" rx="1" fill="#fff" />
          <rect x="11" y="8.5" width="3" height="3" rx=".8" fill="#fff" />
          <rect x="11" y="12.5" width="3" height="6" rx=".8" fill="#fff" />
          <rect x="6" y="14.5" width="4" height="4" rx="1" fill="#fff" />
        </svg>
        <p class="boot-name" aria-hidden="true">{{app.name}}</p>
        <div class="boot-bar" aria-hidden="true">
          <i class="boot-brand"></i>
          <span><i class="boot-txt"></i><i></i></span>
          <span><i class="boot-btn"></i><i class="boot-btn boot-wide"></i><i></i><i></i></span>
          <span class="boot-end"><i class="boot-btn boot-pal"></i><i></i><i></i><i></i><i class="boot-btn"></i></span>
        </div>
        <div class="boot-left" aria-hidden="true">
          <div class="boot-pane"><i class="boot-txt"></i><i class="boot-drop"></i><i class="boot-row"></i><i class="boot-row"></i><i class="boot-row"></i></div>
        </div>
        <div class="boot-stage">
          <div class="boot-sheet"><p class="boot-about">{{app.description}}</p></div>
          <i class="boot-dock" aria-hidden="true"></i><i class="boot-dock" aria-hidden="true"></i>
        </div>
        <div class="boot-right" aria-hidden="true">
          <div class="boot-pane"><div class="boot-tabs"><i></i><i></i></div><i class="boot-txt"></i><i class="boot-field"></i><i class="boot-field"></i><i class="boot-txt"></i><i class="boot-field"></i><i class="boot-field"></i></div>
        </div>
      </div>
      <script>
        // The loading screen in the language the head's script chose.
        (() => {
          const texts = JSON.parse(document.getElementById("boot-copy").textContent).texts[document.documentElement.lang];
          if (!texts) return;
          document.querySelector(".boot").setAttribute("aria-label", texts.loading);
          document.querySelector(".boot h1").textContent = texts.heading;
          document.querySelector(".boot-about").textContent = texts.description;
        })();
      </script>
    <noscript><div class="noscript">{{noscript}}</div></noscript>
  </body>
</html>
