<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <!-- Los textos salen de src/copy/: Vite completa los data-i18n al servir y al compilar. -->
    <title data-i18n="app.title"></title>
    <meta name="description" data-i18n-content="app.description" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='7' y='2.5' width='14' height='17' rx='2.5' fill='%230066ff' opacity='.3'/><rect x='3' y='5' width='14' height='17' rx='2.5' fill='%230066ff'/><rect x='6' y='8.5' width='4' height='5' rx='1' fill='white'/><rect x='11' y='8.5' width='3' height='3' rx='.8' fill='white'/><rect x='11' y='12.5' width='3' height='6' rx='.8' fill='white'/><rect x='6' y='14.5' width='4' height='4' rx='1' fill='white'/></svg>" />
    <!-- Subset latino de Inter: el único que hace falta para la interfaz (el resto, según el texto). -->
    <link rel="preload" href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/app.js"></script>
  </head>
  <body class="is-loading">
    <a id="skip" class="skip-link" href="#sheets" data-i18n="app.skip"></a>

    <header class="topbar">
      <a class="brand" href="./">
        <svg class="brand-mark" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false">
          <rect x="7" y="2.5" width="14" height="17" rx="2.5" fill="currentColor" opacity=".28" />
          <rect x="3" y="5" width="14" height="17" rx="2.5" fill="currentColor" />
          <rect x="6" y="8.5" width="4" height="5" rx="1" fill="#fff" />
          <rect x="11" y="8.5" width="3" height="3" rx=".8" fill="#fff" />
          <rect x="11" y="12.5" width="3" height="6" rx=".8" fill="#fff" />
          <rect x="6" y="14.5" width="4" height="4" rx="1" fill="#fff" />
        </svg>
        <span class="brand-name" data-i18n="app.name"></span>
      </a>

      <!-- Proyecto abierto: nombre (editable en el lugar), estado del guardado y «Proyectos» -->
      <div class="project-group">
        <div id="project" class="project" hidden>
          <button type="button" id="project-name" class="project-name" aria-describedby="project-status-text" data-i18n-note="projects.renameTip">
            <span id="project-name-text" class="project-name-text"></span>
          </button>
          <input type="text" id="project-name-input" class="project-name-input" maxlength="80" autocomplete="off" spellcheck="false" data-i18n-label="projects.nameField" hidden />
          <span id="project-status" class="project-status"><span id="project-status-icon" class="project-status-icon" aria-hidden="true"></span><span id="project-status-text" class="project-status-text"></span></span>
          <button type="button" id="project-retry" class="text-btn project-retry" hidden></button>
        </div>
        <button type="button" id="projects-open" class="tool" aria-haspopup="dialog" data-i18n-label="projects.title" data-i18n-tip="projects.title" data-kbd="Mod+O" data-aks="Control+O Meta+O">
          <span data-icon="folder-open"></span>
        </button>
      </div>

      <div class="bar-group">
        <button type="button" id="add" class="btn ghost" data-i18n-tip="bar.addTip" data-kbd="O" data-aks="O" data-single>
          <span data-icon="image-plus"></span><span class="btn-label" data-i18n="bar.add"></span>
        </button>
        <button type="button" id="arrange" class="btn accent" data-i18n-tip="bar.arrangeTip" data-kbd="A" data-aks="A" data-single>
          <span data-icon="layout-dashboard"></span><span class="btn-label" data-i18n="bar.arrange"></span>
        </button>
        <span class="tool-sep" aria-hidden="true"></span>
        <button type="button" id="undo" class="tool" data-i18n-label="bar.undo" data-i18n-tip="bar.undo" data-kbd="Mod+Z" data-aks="Control+Z Meta+Z">
          <span data-icon="undo-2"></span>
        </button>
        <button type="button" id="redo" class="tool" data-i18n-label="bar.redo" data-i18n-tip="bar.redo" data-kbd="Mod+Shift+Z" data-aks="Control+Shift+Z Meta+Shift+Z Control+Y">
          <span data-icon="redo-2"></span>
        </button>
      </div>

      <div class="bar-group end">
        <button type="button" id="prefs-open" class="tool" aria-haspopup="dialog" data-i18n-label="prefs.title" data-i18n-tip="prefs.title">
          <span data-icon="settings"></span>
        </button>
        <button type="button" id="help" class="tool" aria-haspopup="dialog" data-i18n-label="bar.shortcuts" data-i18n-tip="bar.shortcuts" data-kbd="?" data-aks="?" data-single>
          <span data-icon="keyboard"></span>
        </button>
        <button type="button" id="export" class="tool" data-i18n-label="bar.download" data-i18n-tip="bar.download" data-i18n-note="bar.downloadNote" data-kbd="Mod+S" data-aks="Control+S Meta+S Control+E Meta+E">
          <span data-icon="download"></span>
        </button>
        <button type="button" id="print" class="btn primary" data-i18n-tip="bar.print" data-i18n-note="bar.printNote" data-kbd="Mod+P" data-aks="Control+P Meta+P">
          <span data-icon="printer"></span><span class="btn-label" data-i18n="bar.print"></span>
        </button>
      </div>
      <input type="file" id="file" multiple accept="image/*,application/pdf" hidden />
    </header>

    <div id="workspace" class="workspace">
      <!-- Franja con el botón del panel de piezas (pantallas medianas) -->
      <div class="rail">
        <button type="button" id="pieces-toggle" class="tool" aria-expanded="false" aria-controls="pieces-panel" data-i18n-label="pieces.title" data-i18n-tip="pieces.title" data-kbd="P">
          <span data-icon="list"></span>
        </button>
      </div>

      <aside id="pieces-panel" class="panel panel-left" aria-labelledby="pieces-title">
        <div class="panel-head">
          <h2 id="pieces-title" class="panel-title" data-i18n="pieces.title"></h2>
          <button type="button" class="icon-btn small drawer-close" data-close-panel data-i18n-label="pieces.close" data-i18n-tip="app.close" data-kbd="Escape">
            <span data-icon="x"></span>
          </button>
        </div>
        <button type="button" id="addzone" class="addzone">
          <span data-icon="upload"></span>
          <span class="addzone-text"><span class="addzone-title" data-i18n="pieces.addTitle"></span><span class="addzone-sub" data-i18n="pieces.addSub"></span></span>
        </button>
        <div id="list-empty" class="panel-empty">
          <p data-i18n="pieces.empty"></p>
          <p class="panel-tip" data-i18n="pieces.emptyTip"></p>
        </div>
        <div id="piece-list" class="piece-list" role="listbox" aria-multiselectable="true" aria-labelledby="pieces-title" aria-describedby="list-hint" hidden></div>
        <p id="list-hint" class="sr-only" data-i18n="pieces.listHint"></p>
        <div class="panel-foot">
          <span id="piece-total" class="foot-count" data-i18n="pieces.count" data-i18n-params='{"n":0}'></span>
          <button type="button" id="clear" class="text-btn danger" data-i18n="pieces.clear"></button>
        </div>
      </aside>

      <main id="canvas" class="canvas">
        <h1 class="sr-only" data-i18n="app.heading"></h1>

        <div id="stage" class="stage">
          <!-- Las hojas (.page) las arma sheetview.js, una debajo de otra. -->
          <div id="sheets" class="sheets">
            <button type="button" id="empty" class="dropzone" data-aks="O" data-single>
              <span class="dropzone-icon"><span data-icon="upload"></span></span>
              <span id="empty-text" class="dropzone-title" data-i18n="sheet.drop"></span>
              <span id="empty-sub" class="dropzone-sub" data-i18n="sheet.private"></span>
            </button>
            <div id="drag-layer" class="drag-layer"></div>
            <div id="frame" class="frame" aria-hidden="true" hidden><span id="handle" class="handle"></span></div>
            <div class="sheets-foot">
              <p id="paper-label" class="paper-label"></p>
              <button type="button" id="add-sheet" class="add-sheet" data-i18n-tip="sheet.addTip"><span data-icon="file-plus"></span><span data-i18n="sheet.add"></span></button>
            </div>
          </div>
        </div>

        <div id="piecebar" class="piecebar" role="toolbar" data-i18n-label="piecebar.label" hidden>
          <span id="piece-size" class="piecebar-size" aria-hidden="true"></span>
          <button type="button" class="icon-btn" data-action="rotate-left" data-i18n-label="piecebar.rotateLeft" data-i18n-tip="piecebar.rotateLeftTip" data-kbd="Shift+R" data-aks="Shift+R" data-single><span data-icon="rotate-ccw"></span></button>
          <button type="button" class="icon-btn" data-action="rotate-right" data-i18n-label="piecebar.rotateRight" data-i18n-tip="piecebar.rotateRightTip" data-kbd="R" data-aks="R" data-single><span data-icon="rotate-cw"></span></button>
          <button type="button" class="icon-btn" data-action="duplicate" data-i18n-label="piecebar.duplicate" data-i18n-tip="piecebar.duplicate" data-kbd="D" data-aks="D" data-single><span data-icon="copy"></span></button>
          <span class="piecebar-sep" aria-hidden="true"></span>
          <button type="button" class="icon-btn danger" data-action="remove" data-i18n-label="piecebar.remove" data-i18n-tip="piecebar.removeTip" data-kbd="Delete" data-aks="Delete Backspace"><span data-icon="trash-2"></span></button>
        </div>

        <div class="dock">
          <button type="button" id="pieces-dock" class="dock-btn" aria-expanded="false" aria-controls="pieces-panel">
            <span data-icon="list"></span><span data-i18n="dock.pieces"></span><span id="dock-count" class="dock-count"></span>
          </button>
          <button type="button" id="props-toggle" class="dock-btn" aria-expanded="false" aria-controls="props-panel">
            <span data-icon="sliders-horizontal"></span><span data-i18n="dock.props"></span>
          </button>
        </div>

        <div id="pill" class="pill" hidden>
          <span id="pill-icon" class="pill-icon"></span>
          <span id="pill-text" class="pill-text"></span>
          <button type="button" id="pill-action" class="pill-action" hidden></button>
          <button type="button" id="pill-close" class="pill-close" data-i18n-label="notices.close" hidden><span data-icon="x"></span></button>
        </div>

        <p id="piece-hint" class="sr-only"></p>
        <div id="live-polite" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
        <div id="live-assertive" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>
        <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
      </main>

      <aside id="props-panel" class="panel panel-right" data-i18n-label="props.title">
        <div class="panel-head drawer-head">
          <p class="panel-title" data-i18n="props.title"></p>
          <button type="button" class="icon-btn small drawer-close" data-close-panel data-i18n-label="props.close" data-i18n-tip="app.close" data-kbd="Escape">
            <span data-icon="x"></span>
          </button>
        </div>

        <!-- 1. Pieza (solo con selección; con varias, «N piezas») -->
        <div class="prop-section" id="section-piece">
          <h2 id="piece-title" class="section-title static" data-i18n="props.piece"></h2>
          <p id="piece-empty" class="panel-empty" data-i18n="props.empty"></p>
          <div id="piece-props" class="section-body" hidden>
            <p id="piece-name" class="piece-name"></p>
            <div class="prop-grid">
              <label class="num-field prefixed">
                <span class="num-prefix" aria-hidden="true" data-i18n="props.x"></span>
                <input id="pos-x" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" data-i18n-tip="props.xTip" />
                <span class="num-unit" aria-hidden="true" data-i18n="units.mm" data-unit></span>
              </label>
              <label class="num-field prefixed">
                <span class="num-prefix" aria-hidden="true" data-i18n="props.y"></span>
                <input id="pos-y" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" data-i18n-tip="props.yTip" />
                <span class="num-unit" aria-hidden="true" data-i18n="units.mm" data-unit></span>
              </label>
              <label class="num-field prefixed">
                <span class="num-prefix" aria-hidden="true"><span data-icon="move-horizontal"></span></span>
                <input id="width" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" data-i18n-tip="props.widthTip" />
                <span class="num-unit" aria-hidden="true" data-i18n="units.mm" data-unit></span>
              </label>
              <label class="num-field prefixed">
                <span class="num-prefix" aria-hidden="true"><span data-icon="move-vertical"></span></span>
                <input id="height" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" data-i18n-tip="props.heightTip" />
                <span class="num-unit" aria-hidden="true" data-i18n="units.mm" data-unit></span>
              </label>
            </div>
            <div class="scale-row">
              <label class="num-field prefixed">
                <span class="num-prefix" aria-hidden="true"><span data-icon="scaling"></span></span>
                <input id="scale" type="number" min="1" max="1000" step="0.1" inputmode="decimal" data-i18n-label="props.scaleLabel" data-i18n-tip="props.scaleTip" />
                <span class="num-unit" aria-hidden="true" data-i18n="units.percent"></span>
              </label>
              <input id="slider" type="range" min="1" max="200" step="0.1" data-i18n-label="props.slider" data-i18n-tip="props.slider" />
            </div>
            <p id="resolution-note" class="field-note quality">
              <span id="resolution-icon" class="quality-icon"></span><span id="resolution-text"></span>
            </p>
            <p id="rotation-note" class="field-note" hidden>
              <span data-icon="rotate-cw"></span><span><strong id="rotation-angle" data-i18n="props.rotated" data-i18n-params='{"deg":90}'></strong><span data-i18n="props.rotatedNote"></span></span>
            </p>
            <div class="action-row" role="group" data-i18n-label="props.quick">
              <button type="button" id="actual" class="chip-btn" data-i18n="props.actual" data-i18n-label="props.actualLabel" data-i18n-tip="props.actualTip"></button>
              <button type="button" id="piece-fit" class="icon-btn" data-i18n-label="props.fit" data-i18n-tip="props.fit" data-kbd="F" data-aks="F" data-single><span data-icon="maximize-2"></span></button>
              <button type="button" id="piece-center" class="icon-btn" data-i18n-label="props.center" data-i18n-tip="props.center" data-kbd="C" data-aks="C" data-single><span data-icon="crosshair"></span></button>
              <button type="button" id="piece-front" class="icon-btn" data-i18n-label="props.front" data-i18n-tip="props.front" data-kbd="]" data-aks="]" data-single><span data-icon="bring-to-front"></span></button>
            </div>
            <!-- Alinear y distribuir (con una pieza, contra el área útil) -->
            <div class="arrange-tools">
              <p id="align-sheet-note" class="tools-note field-label" data-i18n="props.alignSheetNote" hidden></p>
              <div id="align-to-field" class="tools-head" role="group" aria-labelledby="align-to-label">
                <span id="align-to-label" class="field-label" data-i18n="props.alignTo"></span>
                <div id="align-to" class="segmented chips small">
                  <label class="seg"><input type="radio" name="align-to" value="selection" checked /><span data-i18n="props.alignToSelection"></span></label>
                  <label class="seg"><input type="radio" name="align-to" value="sheet" /><span data-i18n="props.alignToSheet"></span></label>
                </div>
              </div>
              <div id="align-row" class="tool-row" role="group" data-i18n-label="props.align">
                <button type="button" class="icon-btn" data-align="left" data-i18n-label="props.alignLeft" data-i18n-tip="props.alignLeft" data-kbd="Alt+Shift+ArrowLeft" data-aks="Alt+Shift+ArrowLeft"><span data-icon="align-start-vertical"></span></button>
                <button type="button" class="icon-btn" data-align="centerX" data-i18n-label="props.alignCenterX" data-i18n-tip="props.alignCenterX" data-kbd="Alt+Shift+H" data-aks="Alt+Shift+H"><span data-icon="align-center-vertical"></span></button>
                <button type="button" class="icon-btn" data-align="right" data-i18n-label="props.alignRight" data-i18n-tip="props.alignRight" data-kbd="Alt+Shift+ArrowRight" data-aks="Alt+Shift+ArrowRight"><span data-icon="align-end-vertical"></span></button>
                <button type="button" class="icon-btn" data-align="top" data-i18n-label="props.alignTop" data-i18n-tip="props.alignTop" data-kbd="Alt+Shift+ArrowUp" data-aks="Alt+Shift+ArrowUp"><span data-icon="align-start-horizontal"></span></button>
                <button type="button" class="icon-btn" data-align="centerY" data-i18n-label="props.alignCenterY" data-i18n-tip="props.alignCenterY" data-kbd="Alt+Shift+V" data-aks="Alt+Shift+V"><span data-icon="align-center-horizontal"></span></button>
                <button type="button" class="icon-btn" data-align="bottom" data-i18n-label="props.alignBottom" data-i18n-tip="props.alignBottom" data-kbd="Alt+Shift+ArrowDown" data-aks="Alt+Shift+ArrowDown"><span data-icon="align-end-horizontal"></span></button>
              </div>
              <div class="tools-head wide" role="group" aria-labelledby="distribute-label">
                <span id="distribute-label" class="field-label" data-i18n="props.distributeBy"></span>
                <div id="distribute-mode" class="segmented chips small">
                  <label class="seg"><input type="radio" name="distribute-mode" value="gap" checked /><span data-i18n="props.distributeGap"></span></label>
                  <label class="seg"><input type="radio" name="distribute-mode" value="even" /><span data-i18n="props.distributeEven"></span></label>
                </div>
              </div>
              <div id="distribute-row" class="tool-row" role="group" data-i18n-label="props.distribute">
                <button type="button" class="icon-btn" data-distribute="x" data-i18n-label="props.distributeX" data-i18n-tip="props.distributeX" data-kbd="Alt+Shift+X" data-aks="Alt+Shift+X"><span data-icon="align-horizontal-space-between"></span></button>
                <button type="button" class="icon-btn" data-distribute="y" data-i18n-label="props.distributeY" data-i18n-tip="props.distributeY" data-kbd="Alt+Shift+Y" data-aks="Alt+Shift+Y"><span data-icon="align-vertical-space-between"></span></button>
                <p id="distribute-note" class="tools-note"></p>
              </div>
            </div>
            <!-- Copias de las elegidas y «Seleccionar iguales» -->
            <div class="copy-row">
              <div class="dup-group" role="group" data-i18n-label="props.duplicateGroup">
                <button type="button" id="dup-many" class="chip-btn icon-chip"><span data-icon="copy-plus"></span><span id="dup-many-text" data-i18n="props.duplicate"></span></button>
                <label class="num-field prefixed dup-count">
                  <span class="num-prefix" aria-hidden="true" data-i18n="props.times"></span>
                  <input id="dup-count" type="number" min="1" step="1" value="1" inputmode="numeric" data-i18n-label="props.duplicateCount" data-i18n-tip="props.duplicateCount" />
                </label>
              </div>
              <button type="button" id="select-same" class="chip-btn icon-chip" data-i18n-tip="props.selectSameTip" data-kbd="I" data-aks="I" data-single><span data-icon="images"></span><span data-i18n="props.selectSame"></span></button>
            </div>
            <label id="page-row" class="field" hidden>
              <span class="field-label" data-i18n="props.page"></span>
              <select id="page"></select>
            </label>
            <details id="fill-details" class="fill-details">
              <summary><span data-icon="grid-2x2-plus"></span><span data-i18n="props.fill"></span></summary>
              <div class="fill-body">
                <p id="fill-summary" class="fill-summary" aria-live="polite"></p>
                <p class="callout"><span data-icon="triangle-alert"></span><span id="fill-warning" data-i18n="props.fillWarning"></span></p>
                <button type="button" id="fill" class="btn primary block" data-i18n="props.fill"></button>
              </div>
            </details>
            <button type="button" id="piece-remove" class="text-btn danger remove-btn"><span data-icon="trash-2"></span><span data-i18n="props.remove"></span></button>
          </div>
        </div>

        <!-- 2. Hoja -->
        <div class="prop-section" data-section="sheet">
          <h2 class="section-title">
            <button type="button" class="section-toggle" aria-expanded="true" aria-controls="section-sheet"><span data-i18n="props.sheet"></span><span data-icon="chevron-down" class="chevron"></span></button>
          </h2>
          <div id="section-sheet" class="section-body">
            <div class="paper-row">
              <label class="field">
                <span class="field-label" data-i18n="props.size"></span>
                <select id="paper"></select>
              </label>
              <fieldset class="field">
                <legend class="field-label" data-i18n="props.orientation"></legend>
                <div class="segmented icons">
                  <label class="seg">
                    <input type="radio" name="orientation" id="portrait" value="portrait" data-i18n-tip="props.portrait" checked />
                    <span><span data-icon="rectangle-vertical"></span><span class="sr-only" data-i18n="props.portrait"></span></span>
                  </label>
                  <label class="seg">
                    <input type="radio" name="orientation" id="landscape" value="landscape" data-i18n-tip="props.landscape" data-kbd="L" data-aks="L" data-single />
                    <span><span data-icon="rectangle-horizontal"></span><span class="sr-only" data-i18n="props.landscape"></span></span>
                  </label>
                </div>
              </fieldset>
            </div>
            <div id="custom-paper" class="custom-paper" hidden>
              <div class="prop-grid">
                <label class="num-field prefixed">
                  <span class="num-prefix" aria-hidden="true"><span data-icon="move-horizontal"></span></span>
                  <input id="paper-w" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" data-i18n-tip="papers.width" />
                  <span class="num-unit" aria-hidden="true" data-i18n="units.mm" data-unit></span>
                </label>
                <label class="num-field prefixed">
                  <span class="num-prefix" aria-hidden="true"><span data-icon="move-vertical"></span></span>
                  <input id="paper-h" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" data-i18n-tip="papers.height" />
                  <span class="num-unit" aria-hidden="true" data-i18n="units.mm" data-unit></span>
                </label>
              </div>
              <p id="paper-error" class="field-error" hidden></p>
              <p id="paper-match" class="field-note" hidden></p>
            </div>
            <label class="field inline">
              <span class="field-label"><span data-i18n="props.margin"></span><span id="margin-unit" class="sr-only"></span></span>
              <span class="num-field">
                <input id="margin" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" />
                <span class="num-unit" aria-hidden="true" data-i18n="units.mm" data-unit></span>
              </span>
            </label>
          </div>
        </div>

        <!-- 3. Distribución -->
        <div class="prop-section" data-section="arrange">
          <h2 class="section-title">
            <button type="button" class="section-toggle" aria-expanded="true" aria-controls="section-arrange"><span data-i18n="props.arrange"></span><span data-icon="chevron-down" class="chevron"></span></button>
          </h2>
          <div id="section-arrange" class="section-body">
            <label class="field inline">
              <span class="field-label"><span data-i18n="props.gap"></span><span id="gap-unit" class="sr-only"></span></span>
              <span class="num-field">
                <input id="gap" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" />
                <span class="num-unit" aria-hidden="true" data-i18n="units.mm" data-unit></span>
              </span>
            </label>
            <div class="switch-row">
              <label for="allow-rotate"><span data-i18n="props.rotate"></span><span class="switch-hint" id="allow-rotate-hint" data-i18n="props.rotateHint"></span></label>
              <input type="checkbox" role="switch" id="allow-rotate" aria-describedby="allow-rotate-hint" checked />
            </div>
            <div class="switch-row">
              <label for="allow-overlap"><span data-i18n="props.overlap"></span><span class="switch-hint" id="allow-overlap-hint" data-i18n="props.overlapHint"></span></label>
              <input type="checkbox" role="switch" id="allow-overlap" aria-describedby="allow-overlap-hint" />
            </div>
          </div>
        </div>

        <!-- 4. Grilla -->
        <div class="prop-section" data-section="grid">
          <h2 class="section-title">
            <button type="button" class="section-toggle" aria-expanded="true" aria-controls="section-grid"><span data-i18n="props.grid"></span><span data-icon="chevron-down" class="chevron"></span></button>
          </h2>
          <div id="section-grid" class="section-body">
            <div class="switch-row">
              <label for="grid-show"><span><span data-i18n="props.gridShow"></span> <kbd class="inline-kbd" data-single-hint>G</kbd></span><span class="switch-hint" id="grid-show-hint" data-i18n="props.gridShowHint"></span></label>
              <input type="checkbox" role="switch" id="grid-show" aria-describedby="grid-show-hint" data-aks="G" data-single />
            </div>
            <fieldset class="field">
              <legend class="field-label" data-i18n="props.gridSize"></legend>
              <div class="grid-size">
                <div id="grid-chips" class="segmented chips"></div>
                <span class="num-field">
                  <input id="grid-size" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" />
                  <span class="num-unit" aria-hidden="true" data-i18n="units.mm" data-unit></span>
                </span>
              </div>
            </fieldset>
            <div class="switch-row">
              <label for="grid-snap"><span class="with-icon"><span data-icon="magnet"></span><span data-i18n="props.snap"></span></span><span class="switch-hint" id="grid-snap-hint" data-i18n="props.snapHint"></span></label>
              <input type="checkbox" role="switch" id="grid-snap" aria-describedby="grid-snap-hint" checked />
            </div>
          </div>
        </div>
      </aside>
    </div>

    <p class="print-only" data-i18n="app.printOnly"></p>

    <dialog id="donate" class="donate" aria-labelledby="donate-title" aria-describedby="donate-body">
      <div class="donate-hero" aria-hidden="true">
        <svg class="donate-art" viewBox="0 0 240 132" width="240" height="132" focusable="false">
          <g transform="rotate(-7 120 80)">
            <rect x="70" y="18" width="104" height="134" rx="7" fill="#fff" />
            <rect x="81" y="29" width="40" height="50" rx="3.5" fill="#8fb4ff" />
            <rect x="125" y="29" width="38" height="30" rx="3.5" fill="#ffb59c" />
            <rect x="125" y="63" width="38" height="44" rx="3.5" fill="#c9bcff" />
            <rect x="81" y="83" width="40" height="24" rx="3.5" fill="#ffd77f" />
            <rect x="81" y="111" width="82" height="22" rx="3.5" fill="#9fe0c4" />
          </g>
        </svg>
        <span class="donate-heart"><span data-icon="heart"></span></span>
      </div>
      <button type="button" id="donate-close" class="icon-btn donate-close" data-i18n-label="donate.close"><span data-icon="x"></span></button>
      <div class="donate-content">
        <h2 id="donate-title" class="donate-title" tabindex="-1" data-i18n="donate.title"></h2>
        <div id="donate-body" class="donate-body">
          <p data-i18n="donate.body1"></p>
          <p data-i18n="donate.body2"></p>
        </div>
        <ul id="donate-benefits" class="donate-benefits">
          <li><span data-icon="megaphone-off"></span><span data-i18n="donate.benefits.noAds"></span></li>
          <li><span data-icon="droplet-off"></span><span data-i18n="donate.benefits.noWatermark"></span></li>
          <li><span data-icon="shield-check"></span><span data-i18n="donate.benefits.private"></span></li>
        </ul>
        <a id="donate-cta" class="donate-cta" href="#" target="_blank" rel="noopener noreferrer">
          <span data-icon="heart"></span><span id="donate-cta-text" data-i18n="donate.cta"></span>
        </a>
        <p id="donate-note" class="donate-note" data-i18n="donate.ctaNote"></p>
        <button type="button" id="donate-skip" class="donate-skip" data-i18n="donate.skip"></button>
        <label class="donate-never"><input type="checkbox" id="donate-never" /><span id="donate-never-text" data-i18n="donate.never"></span></label>
        <p id="donate-thanks" class="donate-thanks" data-i18n="donate.thanks"></p>
      </div>
    </dialog>

    <dialog id="shortcuts" class="dialog" aria-labelledby="shortcuts-title">
      <div class="dialog-head">
        <h2 id="shortcuts-title" class="dialog-title" data-i18n="shortcuts.title"></h2>
        <button type="button" id="shortcuts-close" class="icon-btn" data-i18n-label="app.close"><span data-icon="x"></span></button>
      </div>
      <div class="dialog-body">
        <!-- «Los atajos de 1 tecla se activan en Preferencias», con el enlace (shortcuts.js) -->
        <p id="shortcuts-note" class="dialog-note"></p>
        <table class="keys">
          <caption class="sr-only" data-i18n="shortcuts.caption"></caption>
          <thead>
            <tr>
              <th scope="col" data-i18n="shortcuts.key"></th>
              <th scope="col" data-i18n="shortcuts.action"></th>
            </tr>
          </thead>
          <tbody id="shortcuts-rows"></tbody>
        </table>
      </div>
    </dialog>
    <dialog id="projects" class="dialog projects" aria-labelledby="projects-title">
      <div class="dialog-head">
        <h2 id="projects-title" class="dialog-title" data-i18n="projects.title"></h2>
        <button type="button" id="projects-close" class="icon-btn" data-i18n-label="app.close"><span data-icon="x"></span></button>
      </div>
      <div class="dialog-body">
        <div class="projects-top">
          <button type="button" id="project-new" class="btn primary"><span data-icon="plus"></span><span data-i18n="projects.new"></span></button>
          <p class="projects-note" data-i18n="projects.newNote"></p>
        </div>
        <p id="projects-unavailable" class="callout" hidden><span data-icon="triangle-alert"></span><span data-i18n="projects.unavailable"></span></p>
        <ul id="project-list" class="project-list" aria-labelledby="projects-title"></ul>
        <p id="projects-empty" class="projects-empty" data-i18n="projects.empty" hidden></p>
      </div>
      <div class="dialog-foot">
        <p class="projects-usage"><span data-icon="hard-drive"></span><span id="projects-usage"></span></p>
      </div>
    </dialog>

    <dialog id="confirm" class="dialog confirm" aria-labelledby="confirm-title" aria-describedby="confirm-body">
      <div class="dialog-head">
        <h2 id="confirm-title" class="dialog-title"></h2>
      </div>
      <div class="dialog-body">
        <p id="confirm-body" class="confirm-body"></p>
      </div>
      <div class="dialog-actions">
        <button type="button" id="confirm-cancel" class="btn ghost" data-i18n="confirm.cancel"></button>
        <button type="button" id="confirm-ok" class="btn danger"></button>
      </div>
    </dialog>

    <dialog id="prefs" class="dialog prefs" aria-labelledby="prefs-title">
      <div class="dialog-head">
        <h2 id="prefs-title" class="dialog-title" data-i18n="prefs.title"></h2>
        <button type="button" id="prefs-close" class="icon-btn" data-i18n-label="app.close"><span data-icon="x"></span></button>
      </div>
      <div class="dialog-body">
        <!-- Dos secciones con el mismo patrón: título y contenido, con un separador entre ellas. -->
        <div class="pref-section" role="group" aria-labelledby="prefs-units-title">
          <h3 id="prefs-units-title" class="pref-title" data-i18n="prefs.units"></h3>
          <div class="segmented chips units">
            <label class="seg"><input type="radio" name="unit" value="mm" aria-describedby="units-hint" /><span><span data-i18n="units.mm"></span><span class="sr-only" data-i18n="prefs.unitNames.mm"></span></span></label>
            <label class="seg"><input type="radio" name="unit" value="cm" aria-describedby="units-hint" /><span><span data-i18n="units.cm"></span><span class="sr-only" data-i18n="prefs.unitNames.cm"></span></span></label>
            <label class="seg"><input type="radio" name="unit" value="in" aria-describedby="units-hint" /><span><span data-i18n="units.in"></span><span class="sr-only" data-i18n="prefs.unitNames.in"></span></span></label>
          </div>
          <p class="switch-hint" id="units-hint" data-i18n="prefs.unitsHint"></p>
        </div>
        <div class="pref-section" role="group" aria-labelledby="prefs-keys-title">
          <h3 id="prefs-keys-title" class="pref-title" data-i18n="prefs.keyboard"></h3>
          <div class="switch-row">
            <label for="single-keys"><span data-i18n="prefs.singleKeys"></span><span class="switch-hint" id="single-keys-hint" data-i18n="prefs.singleKeysHint"></span></label>
            <input type="checkbox" role="switch" id="single-keys" aria-describedby="single-keys-hint" checked />
          </div>
        </div>
      </div>
    </dialog>
  </body>
</html>
